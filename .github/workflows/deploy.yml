name: Deploy Stremio

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */5 * * *"
  push:
    branches:
      - main

jobs:
  run-addon:
    name: Run Telegram Stremio Addon
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential gcc python3-dev git curl wget

      - name: Install Python Packages
        run: |
          pip install --upgrade pip
          pip install --no-cache-dir -r requirements.txt tgcrypto

      - name: Install Cloudflared
        run: |
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared-linux-amd64.deb
          rm -f cloudflared-linux-amd64.deb

      - name: Start Server
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          USER_SESSION_STRING: ${{ secrets.USER_SESSION_STRING }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          API_KEY: ${{ secrets.API_KEY }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          LOG_CHANNEL_ID: ${{ secrets.LOG_CHANNEL_ID }}
          TIMEZONE: ${{ secrets.TIMEZONE }}
          CLOUDFLARE_TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
          PORT: 7860
        run: |
          chmod +x run_server.sh
          ./run_server.sh
